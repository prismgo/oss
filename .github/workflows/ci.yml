name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
        with:
          path: oss

      - name: Check out framework
        uses: actions/checkout@v4
        with:
          repository: prismgo/framework
          path: framework

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: oss/go.sum

      - name: Verify declared module dependencies
        working-directory: oss
        env:
          GOWORK: "off"
        run: go build ./...

      - name: Create workspace
        run: go work init ./framework ./oss

      - name: Test extension
        working-directory: oss
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce 90 percent statement coverage
        if: runner.os == 'Linux'
        working-directory: oss
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90) exit 1 }'
